name: Bedringh build

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.0.31). Leave empty to use package.json version.'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Resolve app version
        shell: bash
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            APP_VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(node -p "require('./apps/app-frontend/package.json').version")"
          fi
          echo "Resolved version: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set application version in manifests
        shell: bash
        run: |
          APP_VERSION="${{ steps.version.outputs.app_version }}"
          node -e "const fs=require('fs');const p='apps/app-frontend/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${APP_VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,'\t')+'\n');"
          # Update Cargo.toml package versions (first occurrence of version = under [package])
          sed -i -E "0,/^version = \".*\"$/s//version = \"${APP_VERSION}\"/" apps/app/Cargo.toml
          sed -i -E "0,/^version = \".*\"$/s//version = \"${APP_VERSION}\"/" packages/app-lib/Cargo.toml

      - name: Prepare environment file
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Build Windows app (NSIS + MSI)
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "nsis,msi"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bedringh-${{ steps.version.outputs.app_version }}-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bedringh v${{ steps.version.outputs.app_version }}
          draft: false
          prerelease: false
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
